name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: checks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      CI: true
      WRANGLER_SEND_METRICS: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.22.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Check publish safety
        run: pnpm run check:publish
      - name: Run tests
        run: pnpm test
      - name: Typecheck and build without deployment
        run: pnpm run build
      - name: Install browser
        run: pnpm exec playwright install --with-deps chromium
      - name: Verify shopping and checkout pages with local fixtures
        shell: bash
        run: |
          pnpm run dev:shopping > /tmp/mcdebate-worker-ci.log 2>&1 &
          worker_pid=$!
          trap 'kill "$worker_pid" 2>/dev/null || true' EXIT
          ready=false
          for attempt in {1..60}; do
            if curl --fail --silent http://localhost:8790/health > /dev/null; then
              ready=true
              break
            fi
            sleep 1
          done
          if [ "$ready" != true ]; then
            cat /tmp/mcdebate-worker-ci.log
            exit 1
          fi
          pnpm run check:shopping-ui
          pnpm run check:checkout-ui
